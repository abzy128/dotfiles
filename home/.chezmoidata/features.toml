# Paths are destination paths relative to the home directory, not source names.
[features.nvim]
os = ["linux", "darwin", "windows"]
paths = [".config/nvim", "AppData/Local/nvim"]
[features.fastfetch]
os = ["linux", "darwin"]
paths = [".config/fastfetch"]
[features.ghostty]
os = ["linux", "darwin"]
paths = [".config/ghostty"]
[features.tmux]
os = ["linux", "darwin"]
paths = [".tmux.conf", ".config/tmux", ".local/share/tmux"]
[features.zellij]
os = ["linux", "darwin"]
paths = [".config/zellij"]
[features.yazi]
os = ["linux", "darwin"]
paths = [".config/yazi"]
[features.zed]
os = ["linux", "darwin"]
paths = [".config/zed", ".config/cursor-flags.conf"]
[features.powershell]
os = ["windows"]
paths = ["Documents/PowerShell", "Documents/WindowsPowerShell"]
[features.wayland]
os = ["linux"]
paths = [".config/ashell", ".config/cava", ".config/cliphist", ".config/dunst", ".config/hypr", ".config/rofi", ".config/waybar"]
[features.linuxScripts]
os = ["linux"]
paths = [".local/bin/ncalayer", ".local/bin/parseAppsettings.ps1"]
[features.legacyHardwareScripts]
os = ["linux"]
paths = [".local/bin/bootIntoWindows", ".local/bin/lidclosed", ".local/bin/lidopen", ".local/bin/switchgpu", ".local/bin/toggleTouchpad", ".local/bin/updateGrub"]
